name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一分支只跑最新一次（旧的自动取消）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · lint · test · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 让 prisma generate 不联网抓 schema 文档
      CHECKPOINT_DISABLE: '1'
      # CI 用 SQLite 跑 build，避免对生产 PG 的依赖
      DATABASE_URL: 'file:./dev-ci.db'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # 缓存 Next.js 增量构建产物 —— 加速第二次跑
      - name: Cache .next/cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.{ts,tsx}') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Prisma generate (dev schema)
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Sprint 9F:单测进门禁(此前从未在 CI 跑过 vitest)
      - name: Unit tests (vitest)
        run: npm test

      # Sprint 9F:两份 Prisma schema 字段级一致(雷区 §8.8:漏同步 = 生产掉列)
      - name: Schema sync check (dev vs production)
        run: npm run check:schema

      - name: Build
        run: npm run build

      # Sprint 9F:e2e 冒烟进门禁。复用本 job 的 build 产物,用 next start 而不是 dev;
      # 数据库是空的 SQLite(db push 建表),smoke 用例不依赖 seed 数据。
      - name: Prisma db push (CI SQLite)
        run: npx prisma db push --skip-generate

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (playwright)
        run: npm run test:e2e
        env:
          CI: 'true'
          PLAYWRIGHT_WEB_SERVER: start

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # 额外验证：production schema（PG）也能 generate 出来
  # 这一步只检查 schema 自身合法 + Prisma client 类型生成，不连真 DB
  build-prod-schema:
    name: prisma generate (prod schema)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: 'postgresql://user:pass@localhost:5432/dummy'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci
      - run: npx prisma generate --schema=prisma/schema.production.prisma
